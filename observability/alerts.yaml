groups:
  - name: module-runtime
    interval: 30s
    rules:
      - alert: ModuleHighErrorRate
        expr: |
          sum(rate(nhb_module_requests_total{outcome="error"}[5m])) by (module)
            /
          clamp_min(sum(rate(nhb_module_requests_total[5m])) by (module), 1e-9)
            > 0.05
        for: 10m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "High module error rate"
          description: |
            Module {{ $labels.module }} is returning errors for more than 5% of
            requests over the last 10 minutes (current error rate: {{ $value | printf "%.2f" }}).
            Inspect nhb_module_errors_total for offending methods and review the RPC logs.

      - alert: ModuleLatencyP95Degraded
        expr: |
          histogram_quantile(0.95,
            sum(rate(nhb_module_request_duration_seconds_bucket[5m])) by (module, method, le)
          ) > 1
        for: 15m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Module latency regression"
          description: |
            The p95 latency for module {{ $labels.module }} method {{ $labels.method }}
            exceeded 1s for the past 15 minutes. Review downstream dependencies and
            recent deployments.

      - alert: ModuleThrottleSaturation
        expr: sum(increase(nhb_module_throttles_total[5m])) by (module, reason) > 25
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Module throttles saturating"
          description: |
            Module {{ $labels.module }} is rejecting requests due to {{ $labels.reason }}
            more than 25 times in 5 minutes. Validate quota configuration and client behaviour.

      - alert: ModulePauseEngaged
        expr: |
          max_over_time(nhb_module_throttles_total{reason="pause"}[1h])
            - min_over_time(nhb_module_throttles_total{reason="pause"}[1h]) > 0
        for: 30m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Module pause engaged"
          description: |
            A pause guard for module {{ $labels.module }} engaged within the last hour.
            Confirm the pause was intentional and follow the incident response runbook.

      - alert: OracleFeedStale
        expr: max(nhb_oracle_update_age_seconds) > 120
        for: 5m
        labels:
          severity: critical
          team: data
        annotations:
          summary: "Oracle feed stale"
          description: |
            The latest oracle update age exceeded two minutes. Verify upstream feeds
            and restart the swap oracle pipeline if required.

      - alert: ModuleQuotaExhausted
        expr: sum(increase(nhb_module_throttles_total{reason="quota"}[10m])) by (module) > 0
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Module quota exhaustion"
          description: |
            Module {{ $labels.module }} exhausted its address quota in the last ten minutes.
            Coordinate with consumers on request backoff or increase the configured limits.

      - alert: PaymasterAutoTopUpSpikeWarning
        expr: sum(increase(nhb_paymaster_autotopups_total{outcome="success"}[5m])) > 3
        for: 10m
        labels:
          severity: warning
          team: treasury
        annotations:
          summary: "Automatic paymaster top-up spike (warning)"
          description: |
            More than three successful automatic paymaster top-ups executed within five minutes.
            Review recent sponsored activity and confirm the surge aligns with expected merchant load.

      - alert: PaymasterAutoTopUpSpikeCritical
        expr: sum(increase(nhb_paymaster_autotopups_total{outcome="success"}[5m])) > 10
        for: 10m
        labels:
          severity: critical
          team: treasury
        annotations:
          summary: "Automatic paymaster top-up spike (critical)"
          description: |
            More than ten successful automatic paymaster top-ups executed within five minutes.
            Treat the surge as a potential abuse event or runaway sponsorship configuration and
            coordinate with security for immediate review.

      - alert: PaymasterAutoTopUpCapSaturationWarning
        expr: sum(increase(nhb_paymaster_autotopups_total{outcome="failure"}[15m])) > 0
        for: 15m
        labels:
          severity: warning
          team: treasury
        annotations:
          summary: "Automatic paymaster top-ups nearing cap"
          description: |
            Automatic paymaster top-up failures were observed during the last 15 minutes. Inspect the
            `paymaster.autotopup` events for a `daily_cap_exceeded` reason and confirm the configured
            cap still matches the active budget.

      - alert: PaymasterAutoTopUpCapSaturationCritical
        expr: sum(increase(nhb_paymaster_autotopups_total{outcome="failure"}[15m])) > 3
        for: 15m
        labels:
          severity: critical
          team: treasury
        annotations:
          summary: "Automatic paymaster top-ups capped"
          description: |
            More than three automatic paymaster top-up failures occurred within 15 minutes. The
            paymaster is likely saturating its mint cap—raise limits or replenish balances before
            sponsored transactions are throttled.

  - name: consensus-liveness
    interval: 30s
    rules:
      - alert: ConsensusNoCommit
        expr: nhb_consensus_seconds_since_last_commit > 60
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "No block committed for over a minute"
          description: |
            This validator has seen its committed height stand still for {{ $value | printf "%.0f" }}s.
            Grep the validator log for `LIVENESS:` lines: the structured fields separate a peer that is
            down (bft_round advancing with no proposals) from a proposer that cannot build
            (consecutive_build_failures > 0, last_build_error set), from one whose own proposals are
            rejected (`local validation of own proposal failed`), from a lock that cannot be satisfied
            (bft_locked_round >= 0 with the round climbing). See the block production section of the
            validator runbook before restarting anything.

      - alert: ConsensusBuildFailing
        expr: nhb_consensus_build_failures_consecutive >= 2
        for: 30s
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Block proposals keep falling back to empty blocks"
          description: |
            At least two consecutive block builds could not include the offered transactions. The
            chain is producing empty blocks (or none) while transactions wait. Check
            nhb_consensus_build_failures_total by reason: `lifecycle` or `evidence` failures that
            persist on the empty block are not attributable to any transaction and need an operator.

      - alert: ConsensusEmptyBlockFallbackRate
        expr: increase(nhb_consensus_empty_block_fallbacks_total[5m]) > 20
        for: 0m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High rate of empty-block fallbacks"
          description: |
            More than twenty proposals fell back to an empty block in five minutes. Review the
            `proposal containment` log lines for the dominant error class.

      - alert: MempoolNondeterministicTransactions
        expr: increase(nhb_mempool_tx_failures_total{disposition="nondeterministic"}[10m]) > 0
        for: 0m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Transactions excluded because they read the wall clock"
          description: |
            A transaction type whose outcome depends on the wall clock (for example escrow creation
            or refund) was submitted and is not being proposed, because a block containing it cannot
            be re-executed identically by another validator. See the `NONDETERMINISM:` log line for
            the type. These types stay unavailable until the deterministic-time fix is deployed.

      - alert: ConsensusTxPanicRecovered
        expr: increase(nhb_consensus_tx_panics_recovered_total[10m]) > 0
        for: 0m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "A transaction handler panicked while a block was being built"
          description: |
            The panic was contained and the transaction excluded, but a handler that panics on
            submitted input is a bug that can crash a validator that is not running the containment
            layer. Report it with the transaction type from the `proposal containment` log line.
