image:
  tag: staging
ingress:
  enabled: true
  className: nginx
  hosts:
    - host: api.staging.nhbcoin.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: api-staging-tls
      hosts:
        - api.staging.nhbcoin.com
# Deploy precondition: list here the address range of the ingress controller
# pods, plus the range of any load balancer in front of the controller that
# adds its own X-Forwarded-For entry. The gateway keys its rate limits on the
# connecting address, so while this list is empty every client behind the
# ingress is counted in one bucket per ingress pod. The chart refuses to render
# until the list is filled in. Use the narrowest range that covers those
# proxies, never a range that covers every address, and supply the real value
# for this cluster (the chart does not know it).
trustedProxies: []
config:
  content: |
    listen: ":8080"
    observability:
      serviceName: nhb-gateway
      metrics: true
      tracing: true
      logRequests: false
      metricsPrefix: gateway
    services:
      - name: lendingd
        endpoint: http://lendingd:50053
      - name: governd
        endpoint: http://governd:50061
      - name: consensusd
        endpoint: http://consensusd:9090
    rateLimits:
      - id: consensus
        requestsPerMinute: 480
        burst: 80
    trustedProxies: {{ toJson .Values.trustedProxies }}
    auth:
      # Keep authentication enabled for staging traffic.
      enabled: true
      hmacSecret: "{{ .Values.secrets.gatewayHMAC }}"
      scopeClaim: scope
      allowAnonymous: false
secrets:
  gatewayHMAC: ""
