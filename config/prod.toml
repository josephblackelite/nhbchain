    FreeTierTxPerMonth = 100
    MDRBasisPoints = 150
    OwnerWallet = "nhb1spruw63528zhhys2zxfgu2yf5ulcrlcltg3zdj"

    [[global.Fees.Assets]]
      Asset = "NHB"
      MDRBasisPoints = 150
      OwnerWallet = "nhb1spruw63528zhhys2zxfgu2yf5ulcrlcltg3zdj"

    [[global.Fees.Assets]]
      Asset = "ZNHB"
      MDRBasisPoints = 200
      OwnerWallet = "znhb1spruw63528zhhys2zxfgu2yf5ulcrlclx6hfhn"
  [global.Loyalty]
    [global.Loyalty.Dynamic]
      TargetBPS = 50
      MinBPS = 25
      MaxBPS = 100
      SmoothingStepBPS = 5
      CoverageMax = 0.5
      CoverageLookbackDays = 7
      DailyCapPctOf7dFees = 0.6
      DailyCapUSD = 5000.0
      YearlyCapPctOfInitialSupply = 10.0
      EnableProRate = true
      EnforceProRate = true
      [global.Loyalty.Dynamic.PriceGuard]
        Enabled = true
        PricePair = "ZNHB/USD"
        TwapWindowSeconds = 7200
        MaxDeviationBPS = 300
        PriceMaxAgeSeconds = 600
        FallbackMinEmissionZNHBWei = ""
        # Was literally `false` here, but -- like Governance/Slashing/Mempool
        # above -- the config-loading bug fixed this session meant this key
        # was never actually being read: the node has genuinely been running
        # on UseLastGoodPriceFallback=true (config/config.go's DefaultConfig())
        # this whole time. Set to true here so fixing the loading bug doesn't
        # also silently flip this real financial-safety knob (fail-open vs
        # fail-closed during a loyalty price-oracle outage) as a side effect.
        # Whether fail-closed is actually the better policy going forward is
        # a real, separate decision worth making deliberately, not bundled
        # into a config-loader bugfix.
        UseLastGoodPriceFallback = true

[consensus]
  # The round timers, written out. A validator whose file says "0s" for a timer runs
  # on the built-in default for it, which is these values (the live validators do), but
  # consensusd refuses a timer that is not positive, so the shipped file carries the
  # values themselves.
  ProposalTimeout = "2s"
  PrevoteTimeout = "2s"
  PrecommitTimeout = "2s"
  CommitTimeout = "4s"
  # The least time a validator lets pass between seeing a block commit and starting
  # the round of the next height: the pace of block production, at most one block per
  # interval. Everything counted in blocks (epoch length, emission per epoch) follows it;
  # lending interest reads the block timestamp and does not. Omitting the key keeps the default, one second; "0s" turns
  # the wait off and blocks then come as fast as the validators can make them (tens a
  # second while they are in step). The value is local to the validator, changes no
  # message or state rule, and is limited to half the commit timeout (2s at the default
  # 4s). See docs/consensus/block-cadence.md. Both live validators run with 2s.
  MinBlockInterval = "2s"
