# Production template. Every key in this file is one the node reads
# (config/config.go); scripts/verify_prod_config.sh checks it and CI runs that
# check on this file. Before use:
#   - install a byte-for-byte copy of config/genesis.relaunch.json at
#     GenesisFile: its hash is the chain id, so it must never be edited;
#   - set ListenAddress to this host's interface address (the check rejects
#     wildcard binds; 192.0.2.10 is a documentation address and cannot bind);
#   - provide the validator key in the environment variable named by
#     ValidatorKMSEnv;
#   - make the consensus-relevant sections ([governance], [potso.*],
#     [global.*], ...) identical to the other validators' config.toml.
ListenAddress = "192.0.2.10:6001"
RPCAddress = "127.0.0.1:8080"
DataDir = "/var/lib/nhb"
GenesisFile = "/etc/nhb/genesis.relaunch.json"
AllowAutogenesis = false
ValidatorKeystorePath = ""
ValidatorKMSURI = ""
ValidatorKMSEnv = "NHB_VALIDATOR_RAW_KEY"
NetworkName = "nhb-mainnet"

# The node terminates TLS for the RPC and requires client certificates. These
# keys must stay above the first table header: below one they belong to that
# table and the node never reads them.
RPCAllowInsecure = false
RPCTLSCertFile = "/etc/nhb/rpc/rpc.crt"
RPCTLSKeyFile = "/etc/nhb/rpc/rpc.key"
RPCTLSClientCAFile = "/etc/nhb/rpc/clients-ca.pem"

[mempool]
MaxTransactions = 5000

[p2p]
NetworkId = 18346390202490284624
MaxPeers = 64
MaxInbound = 60
MaxOutbound = 30
MinPeers = 12
OutboundPeers = 16
Bootnodes = []
PersistentPeers = []
Seeds = []
BanScore = 100
GreyScore = 50
RateMsgsPerSec = 50
Burst = 200
HandshakeTimeoutMs = 3000
PingIntervalSeconds = 30
PingTimeoutSeconds = 90
BanDurationSeconds = 3600
DialBackoffSeconds = 30
PEX = true

[network_security]
SharedSecretEnv = "NHB_NETWORK_SHARED_SECRET"
SharedSecretFile = "/etc/nhb/network.token"
SharedSecret = ""
AllowInsecure = false
AuthorizationHeader = "x-nhb-network-token"
AllowUnauthenticatedReads = false
ServerTLSCertFile = "/etc/nhb/tls/p2pd.crt"
ServerTLSKeyFile = "/etc/nhb/tls/p2pd.key"
ClientTLSCertFile = "/etc/nhb/tls/consensus.crt"
ClientTLSKeyFile = "/etc/nhb/tls/consensus.key"
ClientCAFile = "/etc/nhb/tls/consensus-ca.pem"
ServerCAFile = "/etc/nhb/tls/p2pd-ca.pem"
AllowedClientCommonNames = ["consensusd"]
ServerName = "p2pd.internal"

