# Production template. Every key in this file is one the node reads
# (config/config.go); scripts/verify_prod_config.sh checks it and CI runs that
# check on this file. Before use:
#   - install a byte-for-byte copy of config/genesis.relaunch.json at
#     GenesisFile: its hash is the chain id, so it must never be edited;
#   - set ListenAddress to this host's interface address (the check rejects
#     wildcard binds; 192.0.2.10 is a documentation address and cannot bind);
#   - provide the validator key in the environment variable named by
#     ValidatorKMSEnv;
#   - the consensus-relevant sections below ([potso], [governance], [swap],
#     [lending], [subscriptions], [global], [consensus]) and
#     QuorumCertActivationHeight and the activation schedule that follows it are
#     copies of config.toml's, which is what the
#     live validators run: a validator whose values differ computes a different
#     state and stops at a state-root mismatch. tests/config keeps them identical
#     (the two lines that name quote sources and providers are left for you to
#     copy, see [swap]); change them only together with config.toml.
ListenAddress = "192.0.2.10:6001"
RPCAddress = "127.0.0.1:8080"
DataDir = "/var/lib/nhb"
GenesisFile = "/etc/nhb/genesis.relaunch.json"
AllowAutogenesis = false
ValidatorKeystorePath = ""
ValidatorKMSURI = ""
ValidatorKMSEnv = "NHB_VALIDATOR_RAW_KEY"
NetworkName = "nhb-mainnet"
QuorumCertActivationHeight = 1380200
# The activation schedule the live validators run with (same values as config.toml and cmd/nhb-snapshot/pins.go): a validator or a
# follower that carries other values computes another state root at the first block a rule applies to and stops at a mismatch.
RewardsByStakeFromEpoch = 17280
POSSweepSkipActivationHeight = 1718500
POSHoldUnstakeGuardActivationHeight = 1718500
GovCreditPreservationActivationHeight = 1719700
FeeRouteAliasActivationHeight = 1720900
LendingFixedTermIDActivationHeight = 1723300
BuybackUnpriceableEpochRefundActivationHeight = 2674600
SwapVoucherSignedBudgetActivationHeight = 2674600
SponsoredTransferFeeCreditActivationHeight = 2674600
ValidatorFlagNonceActivationHeight = 2726000
VoteChainBindingActivationHeight = 2726000
SlashEligibilityRefreshActivationHeight = 2726000
SlashPendingUnbondsActivationHeight = 2726000
EvidenceIntakeGuardActivationHeight = 2726000
UniformTransferFeeActivationHeight = 2770000
TransferFeeGovernanceActivationHeight = 2770000
TransferFeeGovernanceDelayBlocks = 41760
TransferFeeStrictAllowanceActivationHeight = 2770000
BuybackPriceGuardActivationHeight = 2770000
EpochSettlementFailsafeActivationHeight = 2770000
SaleReferenceActivationHeight = 0
SaleReferenceMaxAgeSeconds = 0
SaleReferenceMaxStepBps = 0

# The node terminates TLS for the RPC and requires client certificates. These
# keys must stay above the first table header: below one they belong to that
# table and the node never reads them.
RPCAllowInsecure = false
RPCTLSCertFile = "/etc/nhb/rpc/rpc.crt"
RPCTLSKeyFile = "/etc/nhb/rpc/rpc.key"
RPCTLSClientCAFile = "/etc/nhb/rpc/clients-ca.pem"

