phase: config
description: >-
  Records the validator configuration bundle reviewed during release sign-off.
checks:
  - name: Validator TOML fingerprints
    target: config/
    expect: Hashes for config.toml and the production template are captured for change control.
artifacts:
  - name: Default validator config
    path: config.toml
    format: toml
  - name: Production config template
    path: config/prod.toml
    format: toml
metadata:
  owner: devops
  cadence: release
