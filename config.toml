# First block height from which the free allowance of the transfer fee is strict: the part of a transfer above what is left of the allowance pays the fee, instead of the transfer that crosses the line being free in full (see config/config.go's TransferFeeStrictAllowanceActivationHeight doc comment). 0 leaves the whole-transfer rule, which is what both live validators run with. Set it identically on every validator, to a height above the chain tip, restarting all of them together.
# Scheduled on both live validators since 2026-11-17 (activation batch 2): this is the live value, not 0.
