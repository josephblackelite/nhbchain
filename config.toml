# height above the chain tip, restarting all of them together.
PotsoGovernanceWeightActivationHeight = 0
# First block height from which a zero-value validator register or deregister
# consumes the sender's nonce (see config/config.go's
# ValidatorFlagNonceActivationHeight doc comment). 0 leaves both as they are, which
# is what both live validators run with. Set it identically on every validator, to a
# height above the chain tip, restarting all of them together.
# Scheduled on both live validators since 2026-11-17 (activation batch 1): this is the live value, not 0.
ValidatorFlagNonceActivationHeight = 2726000
# First block height from which a mint voucher that names the running chain's own id
