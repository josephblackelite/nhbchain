BuybackUnpriceableEpochRefundActivationHeight = 2674600
# First block height from which a swap voucher mint's USD budget is read only from signed fields (a voucher in another currency is then refused) (see config/config.go's SwapVoucherSignedBudgetActivationHeight doc comment). 0 leaves it off. Both live validators run with 2674600 (scheduled on 2026-11-17, ahead of the chain tip); a validator or a follower that carries another value computes another state root at that block. Set it identically on every validator.
SwapVoucherSignedBudgetActivationHeight = 2674600
# First block height from which the fee a paymaster pays for a sponsored NHB transfer is credited to the fee collector instead of being destroyed when the transfer gas policy is disabled (see config/config.go's SponsoredTransferFeeCreditActivationHeight doc comment). 0 leaves it off. Both live validators run with 2674600 (scheduled on 2026-11-17, ahead of the chain tip); a validator or a follower that carries another value computes another state root at that block. Set it identically on every validator.
SponsoredTransferFeeCreditActivationHeight = 2674600
# First block height from which a transfer that names a fee domain (pos, p2p, otc) pays exactly what an ordinary transfer pays and nothing more (see config/config.go's UniformTransferFeeActivationHeight doc comment). 0 leaves it off, which is what both live validators run with. It changes the balances a block leaves behind: set it identically on every validator, to a height above the chain tip, restarting all of them together.
