ListenAddress = "127.0.0.1:6001"
RPCAddress = "127.0.0.1:8545"
# The node sits behind nginx (nhbcoin.nginx.conf), which already forwards
# real per-client IPs via X-Real-IP/X-Forwarded-For. Trusting only that one
# local proxy hop lets the rate limiter attribute requests to real client
# IPs instead of bucketing all traffic behind one shared proxy address --
# without this, per-IP limits below are meaningless no matter how tight.
RPCTrustProxyHeaders = true
RPCTrustedProxies = ["127.0.0.1"]
RPCReadHeaderTimeout = 0
RPCReadTimeout = 0
RPCWriteTimeout = 0
RPCIdleTimeout = 0
# Real per-IP attribution now works (see RPCTrustProxyHeaders above), so
# these are tight per-bucket limits rather than the previous 10000/60s
# (~166 req/s, not meaningfully different from unlimited for a public
# financial RPC endpoint). Tune based on observed legitimate traffic.
RPCMaxTxPerWindow = 120
RPCMaxTxPerIP = 120
RPCMaxTxPerIdentity = 120
RPCMaxTxPerChain = 120
RPCMaxTxPerIdentityChain = 120
RPCRateLimitWindow = 60
RPCCallerMetadataMaxTTL = 600
# Safe as-is: rpc/http.go refuses to bind plaintext on a non-loopback
# address, and RPCAddress above stays 127.0.0.1 -- real TLS termination
# happens at nginx, which proxies HTTPS down to this loopback-only listener.
RPCAllowInsecure = true
RPCAllowInsecureUnspecified = false
RPCTLSCertFile = ""
RPCTLSKeyFile = ""
RPCTLSClientCAFile = ""
DataDir = "./nhb-data"
GenesisFile = "./config/genesis.phase-e.json"
AllowAutogenesis = false
# Matches the coordinated activation height both live mainnet validators are
# currently enforcing for NHB-TRIAGE-C1's quorum-certificate check on the
# untrusted P2P block-sync path (see config/config.go's QuorumCertActivationHeight
# doc comment and core/node.go's commitBlock). This value must stay identical
# across every validator -- a new validator whose config leaves this at 0
# (unset) will sync and commit every historical block above this height with
# NO quorum-certificate verification at all: a silent security gap, not a
# functional failure, since sync otherwise succeeds normally. Set 2026-09-02
# to match the live validators' already-active height; if the network is
# ever upgraded again with a new activation height, update this value (and
# redeploy every validator) together, never independently.
QuorumCertActivationHeight = 451949
ValidatorKeystorePath = "validator.keystore"
ValidatorKMSURI = ""
ValidatorKMSEnv = ""
