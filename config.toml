  MinDepositWei = "1000e18"
  VotingPeriodSeconds = 604800
  TimelockSeconds = 172800
  QuorumBps = 2000
  PassThresholdBps = 5000
  # AllowedRoles gates which role names a role.allowlist proposal
  # (native/governance/engine.go's parseRoleAllowlistPayload) may grant/revoke --
  # any role not on this list is rejected at proposal-submission time. This
  # section previously had no AllowedRoles line at all in this file even
  # though the live, deployed config.toml on both validators has carried
  # ["MINTER_NHB", "ROLE_SWAP_PAYOUT_ATTESTOR"] since the swap-payout-attestor
  # role grant executed on 2026-08-24 -- a real drift between this repo and
  # what's actually running, only discovered while adding ROLE_ESCROW_REALM_ADMIN
  # here. Reconciled to match live, plus the new role.
  # ROLE_LOYALTY_ADMIN was added (and granted through a role.allowlist proposal)
  # so the web wallet's admin backend can pause/resume loyalty programs; it stays on
  # this list so a future revoke proposal can still be executed.
  # MINTER_NHB is deliberately NOT grantable by a vote (ledger PL-EXT-39): a passed role proposal could otherwise create a minter. To grant it for a planned key rotation, add it back on every validator, restart them together, and remove it again afterwards.
  AllowedRoles = ["ROLE_SWAP_PAYOUT_ATTESTOR", "ROLE_ESCROW_REALM_ADMIN", "ROLE_LOYALTY_ADMIN"]
  AllowedParams = ["fees.baseFee", "staking.minimumValidatorStake", "staking.aprBps", "staking.payoutPeriodDays", "staking.unbondingDays", "staking.minStakeWei", "staking.maxEmissionPerYearWei", "staking.rewardAsset", "staking.compoundDefault", "loyalty.dynamic.targetBps", "loyalty.dynamic.minBps", "loyalty.dynamic.maxBps", "loyalty.dynamic.smoothingStepBps", "loyalty.dynamic.coverageMax", "loyalty.dynamic.coverageLookbackDays", "loyalty.dynamic.dailyCapPctOf7dFees", "loyalty.dynamic.dailyCapUsd", "loyalty.dynamic.yearlyCapPctOfInitialSupply", "loyalty.dynamic.priceGuard.pricePair", "loyalty.dynamic.priceGuard.twapWindowSeconds", "loyalty.dynamic.priceGuard.priceMaxAgeSeconds", "loyalty.dynamic.priceGuard.maxDeviationBps", "loyalty.dynamic.priceGuard.enabled", "network.seeds", "potso.abuse.MaxUserShareBps", "potso.abuse.MinStakeToEarnWei", "potso.abuse.QuadraticTxDampenAfter", "potso.abuse.QuadraticTxDampenPower", "potso.rewards.EmissionPerEpochWei", "potso.weights.AlphaStakeBps", "market.flatFeeWei"]
  BlockTimestampToleranceSeconds = 5
  # Block time (Unix seconds) from which a parameter-update payload that names one
  # parameter under two keys differing only in surrounding whitespace, with
  # different values, is refused at submission and at execution (see
  # config/config.go's RejectAmbiguousParamKeysFromUnix doc comment). 0 keeps the
  # earlier behaviour; the live validators switch it on at the time below. It decides
  # whether a transaction is valid: set it identically on every validator, to a
  # time after the chain's current block time, restarting all of them together.
  RejectAmbiguousParamKeysFromUnix = 1792936800
  # VotingPeriodSeconds and TimelockSeconds above are read from this file on each
  # validator; they are not chain state, so a short window written into one
  # validator's file times proposals differently on that validator. The node always
  # logs a warning at start-up when either is below 3600 seconds. With
  # EnforceWindowFloors = true it refuses to start instead. Off by default: turning
  # it on stops a node whose file holds a shorter window. It decides nothing about
  # any block, only whether this node starts.
  EnforceWindowFloors = false

[swap]
  AllowedFiat = ["USD", "EUR", "GBP"]
  MaxQuoteAgeSeconds = 120
  SlippageBps = 50
  OraclePriority = ["nowpayments", "coingecko", "manual"]
  TwapWindowSeconds = 300
  TwapSampleCap = 128
  PriceProofMaxDeviationBps = 0
  PayoutAuthorities = ["treasury"]
  # First block height at which a swap payout receipt (transaction type 0x0F)
  # takes its recorded times from the block timestamp and consumes the
  # attestor's nonce. 0 keeps the earlier behaviour (host clock, nonce left
  # alone), which is what both live validators run with. Changing it changes
  # the state root of every block that carries a receipt, so set the same
  # value on every validator, and restart them together, well before the chain
  # reaches that height (see docs/swap/stable-ledger.md).
  PayoutReceiptActivationHeight = 0
  # This section's numeric circuit-breaker caps (per-tx min/max, per-address
  # daily/monthly) are a static, config.toml-driven mint-side defense in
  # depth -- worst-case exposure is already bounded by the fixed,
  # pre-allocated genesis treasury Sale Pool (ZNHB voucher mints draw from
  # it rather than minting new supply), but a single large or duplicated
  # voucher could otherwise still drain a large fraction of the pool in one
  # shot. The redeem-side (swap-out burn, TxTypeRedeemNHB) equivalent --
  # formerly its own [swap.redeemRisk] section here -- is GONE, but for a
  # different reason: it is now exclusively governance-controlled. Submit a
  # policy.swapRiskParams proposal (see native/governance/types.go's
  # ProposalKindSwapRiskParams) to change the redeem caps, which then takes
  # effect identically on every validator's very next transaction with no
  # config edit or restart, ever. Until the first such proposal executes,
  # conservative built-in defaults apply (native/swap/redeem_risk.go's
  # DefaultRedeem* constants). Query the public swap_getRiskParams RPC
  # method to see the values currently in effect.
  [swap.risk]
    PerAddressDailyCapWei = "10000e18"
    PerAddressMonthlyCapWei = "300000e18"
    PerTxMinWei = "1e18"
    PerTxMaxWei = "50000e18"
    VelocityWindowSeconds = 600
    VelocityMaxMints = 5
    SanctionsCheckEnabled = true
    PriceProofSignatureRequired = false
    [swap.risk.cashOut]
  [swap.providers]
    Allow = ["nowpayments"]
  [swap.sanctions]

[lending]
  # Tightened 2026-08-24 from 7500 (75%) after a live collateral-mispricing
  # incident: with no ZNHB/NHB reference price ever submitted and the
  # OracleMaxAgeBlocks guard below previously unset (0, i.e. disabled),
  # ZNHB collateral was silently valued 1:1 against NHB, letting MaxLTV
  # pass on borrows that were actually far riskier in real terms. 6000
  # (60%) is the requested tightened cap, kept well under
  # LiquidationThresholdBps for a real safety buffer once pricing is fixed.
  MaxLTVBps = 6000
  LiquidationThresholdBps = 8500
  ReserveFactorBps = 1000
  ProtocolFeeBps = 0
  DeveloperFeeBps = 0
  DeveloperFeeCollector = ""
  # OracleMaxAgeBlocks/OracleMaxDeviationBps bound guardOracle's staleness
  # and deviation checks on the ZNHB/NHB reference price (see
  # TxTypeLendingRefPrice). Conservative-but-real defaults: refprice
  # submitters are expected to update roughly every 5 minutes, so 1000
  # blocks leaves generous slack before a Borrow/Liquidate is refused for
  # staleness; 50% deviation tolerates a legitimate manual peg update
  # without disabling the check outright.
  OracleMaxAgeBlocks = 1000
  OracleMaxDeviationBps = 5000
  [lending.breaker]
    # Caps on exposure, applied only from LendingRiskActivationHeight (a top-level key
    # above). "0" means no cap, which is what both live validators run with. The
    # sizes are owner decisions: MaxTotalSupplyWei caps what lenders may hold in a pool,
    # MaxTotalBorrowWei what may be borrowed in total, MaxTotalCollateralWei what the
    # collateral vault may hold.
    MaxTotalSupplyWei = "0"
    MaxTotalBorrowWei = "0"
    MaxTotalCollateralWei = "0"
  [lending.risk]
    # Applied only from LendingRiskActivationHeight; all off at their zero value.
    # LiquidationBonusBps is what a liquidator receives above the debt it repays (the
    # engine refuses a value above what LiquidationThresholdBps leaves room for).
    LiquidationBonusBps = 0
    BorrowCapPerBlockWei = "0"
    BorrowCapUtilisationBps = 0
    PauseSupply = false
    PauseBorrow = false
    PauseRepay = false
    PauseLiquidate = false
    CircuitBreakerActive = false
  [lending.collateralRouting]
    LiquidatorBps = 0
    DeveloperBps = 0
    DeveloperAddress = ""
    ProtocolBps = 0
    ProtocolAddress = ""

[bridge]
  # The ZNHB bridge escrow (ledger PL-BC-C). A holder locks ZNHB into a module account and names a destination on another
  # chain; once its signers attest a burn on the other chain the ZNHB is released back, once per burn id. Off while BridgeActivationHeight is 0, which is what
  # both live validators run with. A chain rule: the same values on every validator, the height above the chain tip,
  # restarting all of them together.
  BridgeActivationHeight = 0
  # One lock may not exceed this many ZNHB wei (decimal string). Empty = no cap.
  MaxLockZNHBWei = ""
  # Stage 1 of the bridge trust plan: no single key releases ZNHB. Required once the bridge is activated; the node
  # refuses to start with an activated bridge and a missing or inconsistent value below.
  # The addresses (nhb1...) whose signatures attest an EVM burn (at least two), and how many distinct ones a release needs (2 up to the number of signers).
  Signers = []
  SignerThreshold = 0
  # The address (nhb1...) that may pause the bridge and cancel a waiting release. It can never release and must not be a signer.
  Guardian = ""
  # The most one release may pay, in ZNHB wei (decimal string).
  MaxReleaseZNHBWei = ""
  # The most that may be released (paid or waiting) in each window of WindowBlocks blocks (height / WindowBlocks), at least MaxReleaseZNHBWei.
  WindowBlocks = 0
  WindowCapZNHBWei = ""
  # A release above DelayAboveZNHBWei waits DelayBlocks blocks before anyone can execute it; the guardian may cancel it meanwhile. Empty / 0 = no waiting.
  DelayAboveZNHBWei = ""
  DelayBlocks = 0
  # Signers, guardian and limits can be replaced from a later height, one [[bridge.Rotations]] table per replacement (FromHeight above the one before, every value given again):
  # [[bridge.Rotations]]
  #   FromHeight = 0
  #   Signers = []
  #   SignerThreshold = 0
  #   Guardian = ""
  #   MaxReleaseZNHBWei = ""
  #   WindowBlocks = 0
  #   WindowCapZNHBWei = ""
  #   DelayAboveZNHBWei = ""
  #   DelayBlocks = 0

[amm]
  # The native ZNHB/NHB constant-product pool (ledger PL-BC-B). Protocol-owned liquidity: only LiquidityProvider adds or
  # removes it; anyone may swap once swaps are open. Off while AmmActivationHeight is 0. A chain rule, as above.
  AmmActivationHeight = 0
  # Swaps stay closed until this height, so the pool is paused by default even after activation. 0 = never open.
  SwapStartHeight = 0
  # Swap fee in basis points of the amount in; it stays in the pool.
  FeeBps = 30
  # One swap may add at most this share of the reserve it adds to (basis points). 0 = 500.
  MaxSwapBps = 500
  # The address (nhb1...) that may add or remove liquidity. Not the admin wallet. Required once activated.
  LiquidityProvider = ""
  # Floors no swap or partial removal may take a reserve below (decimal strings). Empty = 1.
  MinReserveZNHBWei = ""
  MinReserveNHBWei = ""

[subscriptions]
  # ManagementFeeBps is NHBCoin's own platform fee for running the
  # recurring-billing engine, charged in addition to (never instead of)
  # the ordinary transfer fee -- a subscription charge never goes through
  # the transfer-fee path at all. 100 = 1.00%, a fraction of Stripe-class
  # (~2.9%+30c) take rates by design. ManagementFeeCapBps is a hard
  # ceiling this value may never exceed without also raising the cap.
  ManagementFeeBps = 100
  ManagementFeeCapBps = 500
  # Treasury receives every charge's management-fee share. Required once
  # ManagementFeeBps > 0 -- node startup panics otherwise. Set to the
  # network's admin/treasury wallet (the genesis adminWallet), which already
  # receives every other fee app-wide. Leave NHB_MASTER_TREASURY unset: the
  # live validators run without it, and a node that points it at any other
  # address computes different state (core/node.go, NewNode).
  Treasury = "nhb1spruw63528zhhys2zxfgu2yf5ulcrlcltg3zdj"
  # MaxRetries is how many consecutive failed charge attempts a
  # subscription tolerates (spaced RetryIntervalSeconds apart) before
  # being permanently suspended.
  MaxRetries = 3
  RetryIntervalSeconds = 86400

[mempool]
  MaxTransactions = 5000
  AllowUnlimited = false

[global]
  [global.Governance]
    # Previously placeholder zero values. Exactly like the Staking section
    # below, these keys being PRESENT (not absent) meant the case-sensitivity
    # bug in config/config.go's IsDefined-gated merge (fixed this session)
    # was the only thing keeping the network on sane defaults -- with that
    # bug fixed, these literal zeros would otherwise start applying for
    # real: 0% quorum/pass thresholds and a 0-second voting period would
    # break governance outright. Corrected to match the Go-level defaults
    # (config/config.go's DefaultConfig()), which is what the network has
    # actually been running on this whole time.
    QuorumBPS = 6000
    PassThresholdBPS = 5000
    VotingPeriodSecs = 604800
  [global.Slashing]
    # Same issue as Governance above -- corrected to match DefaultConfig().
    MinWindowSecs = 60
    MaxWindowSecs = 600
  [global.Mempool]
    # Same issue as Governance above -- corrected to match DefaultConfig().
    # A literal MaxBytes=0 would have meant the mempool could accept zero
    # bytes of pending transactions once the config bug was fixed.
    MaxBytes = 16777216
    POSReservationBPS = 1500
  [global.Blocks]
    MaxTxs = 500
  [global.Staking]
    # Previously all four of these were placeholder zero/empty values, which
    # -- since the TOML key is present (not absent) -- actively override the
    # sensible Go-level defaults (1250/30/7/"ZNHB") rather than falling back
    # to them, per config/config.go's IsDefined-gated merge logic. That
    # silently made staking rewards a no-op (0% APR, 0-day payout period,
    # no reward asset resolvable) and unbonding instant (0 days -- also
    # moot before this session, since the real unbonding delay was a
    # hardcoded 72h constant that never read this value at all; see
    # docs/issue30.md item 15). Corrected to match the Go-level defaults.
    AprBps = 1250
    PayoutPeriodDays = 30
    UnbondingDays = 7
    MinStakeWei = "10000000000000000000000"
    MaxEmissionPerYearWei = "5000000000000000000"
    RewardAsset = "ZNHB"
    CompoundDefault = false
  [global.Pauses]
    Lending = false
    Swap = false
    Escrow = false
    Trade = false
    Loyalty = false
    POTSO = false
    TransferNHB = false
    TransferZNHB = false
    Staking = false
    # SwapRedeem pauses only new swap-out burns (TxTypeRedeemNHB); it never
    # blocks attesting an already-burned request paid/failed.
    SwapRedeem = false
  [global.Quotas]
    # Every module below is checked per transaction SENDER (the recovered
    # signer), not per real end user, and every applyQuota(...) call site
    # (core/state_transition.go's handleNativeTransaction) passes addNHB=0
    # -- MaxNHBPerEpoch is inert chain-wide regardless of module or value,
    # left at 0 everywhere rather than set to a number that's never
    # actually checked. MaxRequestsPerMin is the only field that does
    # anything. Set deliberately generous throughout (100/sec) rather than
    # a tight per-account number: this is meant as a backstop against a
    # genuinely runaway flood (a bug, a compromised key), not a meaningful
    # throttle on real usage -- a tight number here would eventually
    # bottleneck a legitimate high-volume actor (a large exchange account, a
    # future gateway/relayer pooling many real users behind one signing
    # key, the way escrow-gateway already does for escrow today) as this
    # network grows toward real, global-scale volume.
    [global.Quotas.Lending]
      MaxRequestsPerMin = 6000
      MaxNHBPerEpoch = 0
      EpochSeconds = 60
    [global.Quotas.Swap]
      # Gates TxTypeBuyZNHB (purchase ZNHB from the admin wallet),
      # TxTypeBuybackAsk (sell ZNHB into the treasury buyback), and
      # TxTypeRedeemNHB (swap-out) -- the three ordinary, unprivileged
      # user-facing "swap" actions, each previously completely ungated.
      # TxTypeAttestRedemption/TxTypeSwapPayoutReceipt are deliberately
      # excluded -- both are RoleSwapPayoutAttestor-gated trusted-service
      # calls, not ordinary user actions this quota is meant to bound.
      # RedeemNHB additionally has its own separate volume-based circuit
      # breaker (native/swap/redeem_risk.go + core/swap_risk_params.go) --
      # this request-frequency quota is an independent, complementary
      # backstop, not a replacement for it.
      MaxRequestsPerMin = 6000
      MaxNHBPerEpoch = 0
      EpochSeconds = 60
    [global.Quotas.Escrow]
      # Quota is tracked per transaction sender, not per real end user --
      # every delegated escrow action (TxTypeDelegated{Create,Release,
      # Refund,Dispute}Escrow, core/types/transaction.go) submitted through
      # escrow-gateway is signed by the gateway's own relayer key, so ALL
      # of that traffic pools under one address here regardless of how
      # many distinct people are actually behind it. Set generously enough
      # to cover the gateway's aggregate expected volume, not a tight
      # per-user limit -- real per-integrator throttling is
      # escrow-gateway's own API-key rate limiter's job
      # (ESCROW_GATEWAY_API_RATE_RPS_PER_KEY-equivalent config), this is a
      # coarser backstop against a runaway bug or a compromised key
      # flooding the chain directly.
      MaxRequestsPerMin = 6000
      MaxNHBPerEpoch = 0
      EpochSeconds = 60
    [global.Quotas.Trade]
      # NOT scoped to just Trade-module (arbitration) transactions --
      # core/node.go's addTransaction also reuses this exact config value
      # as the chain's ONLY global per-sender MEMPOOL admission cap,
      # applied to every transaction type from every address
      # (applySenderQuotaLocked, called unconditionally for any signed
      # tx). A tight number here throttles a sender's entire transaction
      # throughput chain-wide, not just arbitration actions -- set very
      # high deliberately so no legitimate high-volume wallet (an
      # exchange, a payments aggregator) ever realistically hits it, while
      # still stopping a truly pathological flood (thousands/sec from one
      # compromised key) from ever reaching the mempool.
      MaxRequestsPerMin = 6000
      MaxNHBPerEpoch = 0
      EpochSeconds = 60
    [global.Quotas.Loyalty]
      # Gates TxTypeCreateLoyaltyBusiness and TxTypeCreateLoyaltyProgram --
      # the two loyalty operations that mint a new ID, same risk profile as
      # every other module's "creation" action. SetPaymaster/AddMerchant/
      # RemoveMerchant/UpdateProgram/PauseProgram/ResumeProgram are
      # deliberately NOT quota-gated -- each is an already-verified business
      # owner (or ROLE_LOYALTY_ADMIN holder) acting on a single resource
      # they already control, not a new-ID-minting action a spam quota is
      # meant to bound.
      MaxRequestsPerMin = 6000
      MaxNHBPerEpoch = 0
      EpochSeconds = 60
    [global.Quotas.POTSO]
      MaxRequestsPerMin = 6000
      MaxNHBPerEpoch = 0
      EpochSeconds = 60
    [global.Quotas.Subscriptions]
      # Previously had no config field at all despite real enforcement
      # (TxTypeSubscriptionCreatePlan/UpdatePlan/Subscribe/Cancel all call
      # applyQuota(moduleSubscriptions, ...)) -- added alongside Market
      # below so both can actually be configured.
      MaxRequestsPerMin = 6000
      MaxNHBPerEpoch = 0
      EpochSeconds = 60
    [global.Quotas.Market]
      # Same gap as Subscriptions above -- TxTypeMarketCreateListing/
      # FillListing/CancelListing call applyQuota(moduleMarket, ...) but
      # had no config field to actually set until now.
      MaxRequestsPerMin = 6000
      MaxNHBPerEpoch = 0
      EpochSeconds = 60
  [global.Paymaster]
    MerchantDailyCapWei = ""
    DeviceDailyTxCap = 0
    GlobalDailyCapWei = ""
    [global.Paymaster.AutoTopUp]
      Enabled = false
      Token = ""
      MinBalanceWei = ""
      TopUpAmountWei = ""
      DailyCapWei = ""
      CooldownSeconds = 0
      # The on-chain role an address must hold before it is topped up, and the cap
      # on the funding account's outflow per UTC day over all sponsors. Both are
      # required to turn the policy on (PL-R5T-64); it is off.
      SponsorRole = ""
      AggregateDailyCapWei = ""
      [global.Paymaster.AutoTopUp.Governance]
        FundingAccount = ""
        Minter = ""
        Approver = ""
        MinterRole = ""
        ApproverRole = ""
  [global.Fees]
    FreeTierTxPerMonth = 100
    MDRBasisPoints = 150
    OwnerWallet = "nhb1spruw63528zhhys2zxfgu2yf5ulcrlcltg3zdj"

    [[global.Fees.Assets]]
      Asset = "NHB"
      MDRBasisPoints = 150
      OwnerWallet = "nhb1spruw63528zhhys2zxfgu2yf5ulcrlcltg3zdj"

    [[global.Fees.Assets]]
      Asset = "ZNHB"
      MDRBasisPoints = 200
      OwnerWallet = "znhb1spruw63528zhhys2zxfgu2yf5ulcrlclx6hfhn"
  [global.Loyalty]
    [global.Loyalty.Dynamic]
      TargetBPS = 50
      MinBPS = 25
      MaxBPS = 100
      SmoothingStepBPS = 5
      CoverageMax = 0.5
      CoverageLookbackDays = 7
      DailyCapPctOf7dFees = 0.6
      DailyCapUSD = 5000.0
      YearlyCapPctOfInitialSupply = 10.0
      EnableProRate = true
      EnforceProRate = true
      [global.Loyalty.Dynamic.PriceGuard]
        Enabled = true
        PricePair = "ZNHB/USD"
        TwapWindowSeconds = 7200
        MaxDeviationBPS = 300
        PriceMaxAgeSeconds = 600
        FallbackMinEmissionZNHBWei = ""
        # Was literally `false` here, but -- like Governance/Slashing/Mempool
        # above -- the config-loading bug fixed this session meant this key
        # was never actually being read: the node has genuinely been running
        # on UseLastGoodPriceFallback=true (config/config.go's DefaultConfig())
        # this whole time. Set to true here so fixing the loading bug doesn't
        # also silently flip this real financial-safety knob (fail-open vs
        # fail-closed during a loyalty price-oracle outage) as a side effect.
        # Whether fail-closed is actually the better policy going forward is
        # a real, separate decision worth making deliberately, not bundled
        # into a config-loader bugfix.
        UseLastGoodPriceFallback = true

[consensus]
  # The round timers, written out. A validator whose file says "0s" for a timer runs
  # on the built-in default for it, which is these values (the live validators do), but
  # consensusd refuses a timer that is not positive, so the shipped file carries the
  # values themselves.
  ProposalTimeout = "2s"
  PrevoteTimeout = "2s"
  PrecommitTimeout = "2s"
  CommitTimeout = "4s"
  # The least time a validator lets pass between seeing a block commit and starting
  # the round of the next height: the pace of block production, at most one block per
  # interval. Everything counted in blocks (epoch length, emission per epoch) follows it;
  # lending interest reads the block timestamp and does not. Omitting the key keeps the default, one second; "0s" turns
  # the wait off and blocks then come as fast as the validators can make them (tens a
  # second while they are in step). The value is local to the validator, changes no
  # message or state rule, and is limited to half the commit timeout (2s at the default
  # 4s). See docs/consensus/block-cadence.md. Both live validators run with 2s.
  MinBlockInterval = "2s"

[network_security]
  ServerTLSCertFile = "/etc/nhb/tls/p2pd.crt"
  ServerTLSKeyFile = "/etc/nhb/tls/p2pd.key"
  ServerCAFile = "/etc/nhb/tls/p2pd-ca.pem"
  ClientCAFile = "/etc/nhb/tls/consensus-ca.pem"
  ClientTLSCertFile = "/etc/nhb/tls/consensus.crt"
  ClientTLSKeyFile = "/etc/nhb/tls/consensus.key"
  AllowInsecure = false
  AllowUnauthenticatedReads = false
  SharedSecret = ""
  SharedSecretFile = "/etc/nhb/network.token"
  SharedSecretEnv = "NHB_NETWORK_SHARED_SECRET"
  AuthorizationHeader = "x-nhb-network-token"
  AllowedClientCommonNames = ["consensusd"]
  ServerName = "p2pd.internal"
  StreamQueueSize = 0
  RelayDropLogRatio = 0.0
