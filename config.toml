ListenAddress = "127.0.0.1:6001"
RPCAddress = "127.0.0.1:8545"
# The node sits behind nginx (nhbcoin.nginx.conf), which already forwards
# real per-client IPs via X-Real-IP/X-Forwarded-For. Trusting only that one
# local proxy hop lets the rate limiter attribute requests to real client
# IPs instead of bucketing all traffic behind one shared proxy address --
# without this, per-IP limits below are meaningless no matter how tight.
RPCTrustProxyHeaders = true
RPCTrustedProxies = ["127.0.0.1"]
RPCReadHeaderTimeout = 0
RPCReadTimeout = 0
RPCWriteTimeout = 0
RPCIdleTimeout = 0
# Real per-IP attribution now works (see RPCTrustProxyHeaders above), so
# these are tight per-bucket limits rather than the previous 10000/60s
# (~166 req/s, not meaningfully different from unlimited for a public
# financial RPC endpoint). Tune based on observed legitimate traffic.
# Off (false): nhb_swapMint, nhb_swapBurn and swap_voucher_get/list/export stay open to
# any valid bearer token when [RPCSwapAuth] has no secrets. true makes them need the
# operator role then (see config/config.go; move callers to operator tokens or to
# partner secrets first).
RPCSwapOperatorNoHMAC = false
RPCMaxTxPerWindow = 120
RPCMaxTxPerIP = 120
RPCMaxTxPerIdentity = 120
RPCMaxTxPerChain = 120
RPCMaxTxPerIdentityChain = 120
RPCRateLimitWindow = 60
RPCCallerMetadataMaxTTL = 600
# Public read queries that scan blocks or hold the state lock share a small pool
# so they cannot take the CPU that block production needs (see
# docs/ops/rpc-query-limits.md). The defaults need no configuration; these are
# the knobs, each shown as zero, which selects the default in the comment.
# A refused query gets HTTP 429, code -32020 and a Retry-After hint.
# RPCQueryMaxConcurrent = 0   # half the CPUs, at least 1 and at most 2
# RPCQueryMaxPerClient = 0    # 1
# RPCQueryQueueDepth = 0      # 8
# RPCQueryQueueWaitMS = 0     # 100
# RPCQueryTimeoutSeconds = 0  # 10
# Set on a node that serves no public RPC: stops the background rebuild of the
# explorer snapshot after every block (and the streams and indexes that go with
# it). Default false keeps today's behaviour.
# RPCDisableExplorerLoop = false
# Safe as-is: rpc/http.go refuses to bind plaintext on a non-loopback
# address, and RPCAddress above stays 127.0.0.1 -- real TLS termination
# happens at nginx, which proxies HTTPS down to this loopback-only listener.
RPCAllowInsecure = true
RPCAllowInsecureUnspecified = false
RPCTLSCertFile = ""
RPCTLSKeyFile = ""
RPCTLSClientCAFile = ""
DataDir = "./nhb-data"
# The live network's genesis file. The chain id (see [p2p] NetworkId) is the
# first 8 bytes of its block hash, so this file must never be edited.
GenesisFile = "./config/genesis.relaunch.json"
AllowAutogenesis = false
# Quorum-certificate verification on the P2P block-sync path (see
# config/config.go's QuorumCertActivationHeight doc comment and core/node.go's
# commitBlock). A block that reaches a node through peer sync above this height
# must carry a quorum certificate that verifies against the validator set at its
# parent height, or it is refused; blocks at or below it, and every block the
# node's own engine commits, are not checked. 1380200 is the value both live
# validators run with. 0 would leave the check off. It does not change state or
# any block's validity, but it must not be changed on one validator alone: set
# it on every validator together, as one coordinated change, and in the same
# release as the pin in cmd/nhb-snapshot/pins.go and the tests.
QuorumCertActivationHeight = 1380200
# The first epoch whose emission is paid by stake (see config/config.go's RewardsByStakeFromEpoch doc comment and core/rewards_logic.go's
# distributeStakeWeighted). From that epoch on, all three reward pools follow stake and are credited to the wallets that locked it, so a validator that is
# only delegated to receives nothing on its own account. 0 keeps the earlier split (equal per validator and by engagement score, to the validator's own
# account). Unlike the setting above this one DOES change state: every validator, and every node that replays blocks from a snapshot, must carry the same
# value, in force before the epoch it names begins. Change it only as one coordinated restart of every validator, in the same release as the pin in
# cmd/nhb-snapshot/pins.go and the tests.
RewardsByStakeFromEpoch = 17280
# First block height at which the end-of-block sweep of expired POS holds goes
# on past a hold whose payer's locked balance no longer covers it (see
# config/config.go's POSSweepSkipActivationHeight doc comment and
# docs/specs/pos-lifecycle.md). 0 keeps the earlier behaviour; the live validators
# switch it on at the height below. Unlike the setting above it changes the state a
# block leaves behind: set it identically on every validator, to a height above
# the chain tip, restarting all of them together.
POSSweepSkipActivationHeight = 1718500
# First block height from which an unstake may not unbond ZNHB that backs a
# pending POS hold (see config/config.go's POSHoldUnstakeGuardActivationHeight
# doc comment and docs/staking/staking.md). 0 leaves the rule off; the live
# validators switch it on at the height below. It decides whether a transaction is valid, so
# set it identically on every validator, to a height above the chain tip,
# restarting all of them together.
POSHoldUnstakeGuardActivationHeight = 1718500
# First block height from which a governance finalize or execute transaction keeps
# a credit the governance engine wrote to the sender's own account (a deposit
# refund, a forfeited-deposit sweep) instead of overwriting it with the account as
# it was before the call (see config/config.go's
# GovCreditPreservationActivationHeight doc comment). 0 leaves it off; the live
# validators switch it on at the height below. It changes the state a block leaves behind: set it
# identically on every validator, to a height above the chain tip, restarting all of
# them together.
GovCreditPreservationActivationHeight = 1719700
# First block height from which an NHB domain fee whose route wallet is the
# transfer's own sender or recipient is credited to that account instead of to a
# separate copy the transfer then overwrites, and the same for the buyback accrual
# share of that fee (see config/config.go's FeeRouteAliasActivationHeight doc
# comment; the same fix for ZNHB is always on).
# 0 leaves the NHB half off; the live validators switch it on at the height below. It
# changes the state a block leaves behind: set it identically on every validator,
# to a height above the chain tip, restarting all of them together.
FeeRouteAliasActivationHeight = 1720900
# First block height from which a fixed-term loan or deposit is stored under an ID
# that includes its owner, and an origination whose ID already has a record is
# refused (see config/config.go's LendingFixedTermIDActivationHeight doc comment).
# 0 keeps the transaction hash as the ID; the live validators switch it on at the
# height below. It changes the key a record is written under: set it identically on every
# validator, to a height above the chain tip, restarting all of them together.
LendingFixedTermIDActivationHeight = 1723300
# First block height at which the tracked NHB supply counter (nhb_getTotalSupply)
# is raised, once, by the part of the genesis allocation it never counted (see
# config/config.go's NHBSupplyGenesisCorrectionActivationHeight doc comment). 0
# leaves the counter as it is, which is what both live validators run with. It
# changes the state a block leaves behind: set it identically on every validator,
# to a height above the chain tip, restarting all of them together.
NHBSupplyGenesisCorrectionActivationHeight = 0
# First block height from which a sender's first TransferMonthlyFreeTierTxPerMonth
# plain transfers in each UTC calendar month, in NHB or ZNHB, pay no transfer fee
# (see config/config.go's TransferMonthlyFreeTierActivationHeight doc comment). 0
# leaves transfers as they are, which is what both live validators run with. It
# changes the state a block leaves behind: set it identically on every validator,
# to a height above the chain tip, restarting all of them together.
TransferMonthlyFreeTierActivationHeight = 0
TransferMonthlyFreeTierTxPerMonth = 0
# First block height from which the daily budget for base rewards is at least
# LoyaltyBudgetFloorZNHBWei, limited to the existing daily USD cap (see
# config/config.go's LoyaltyBudgetFloorActivationHeight doc comment). 0 or an empty
# amount leaves the budget as it is, which is what both live validators run with.
# The size of the floor is an owner decision. Set it identically on every
# validator, to a height above the chain tip, restarting all of them together.
LoyaltyBudgetFloorActivationHeight = 0
LoyaltyBudgetFloorZNHBWei = ""
# First block height from which the weight snapshot that decides who may vote on a
# proposal, and with how much power, counts delegated stake for the delegator and
# is stored every epoch (see config/config.go's PotsoGovernanceWeightActivationHeight
