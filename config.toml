# every validator, to a height above the chain tip, restarting all of them together.
# Scheduled on both live validators since 2026-11-17 (activation batch 1): this is the live value, not 0.
EvidenceIntakeGuardActivationHeight = 2726000
# First block height from which the staking reward rate is the on-chain staking.aprBps
# read at execution, not the value each node cached at start-up from its own config (see
