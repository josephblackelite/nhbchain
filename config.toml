      OwnerWallet = "nhb10lephh6ffd79cc7lk6edc6rkxe9ha8xekt0y8h"

    [[global.Fees.Assets]]
      Asset = "ZNHB"
      MDRBasisPoints = 200
      OwnerWallet = "znhb10lephh6ffd79cc7lk6edc6rkxe9ha8xemef0ak"
  [global.Loyalty]
    [global.Loyalty.Dynamic]
      TargetBPS = 50
      MinBPS = 25
      MaxBPS = 100
      SmoothingStepBPS = 5
      CoverageMax = 0.5
      CoverageLookbackDays = 7
      DailyCapPctOf7dFees = 0.6
      DailyCapUSD = 5000.0
      YearlyCapPctOfInitialSupply = 10.0
      EnableProRate = true
      EnforceProRate = true
      [global.Loyalty.Dynamic.PriceGuard]
        Enabled = true
        PricePair = "ZNHB/USD"
        TwapWindowSeconds = 7200
        MaxDeviationBPS = 300
        PriceMaxAgeSeconds = 600
        FallbackMinEmissionZNHBWei = ""
        # Was literally `false` here, but -- like Governance/Slashing/Mempool
