syntax = "proto3";

package lending.v1;

option go_package = "nhbchain/proto/lending/v1;lendingv1";

message MarketKey {
  string symbol = 1;
}

message Market {
  MarketKey key = 1;
  string base_asset = 2;
  string collateral_factor = 3;
  string reserve_factor = 4;
  string liquidity_index = 5;
  string borrow_index = 6;
}

message AccountPosition {
  string account = 1;
  string supplied = 2;
  string borrowed = 3;
  string collateral = 4;
  string health_factor = 5;
}

message GetMarketRequest {
  MarketKey key = 1;
}

message GetMarketResponse {
  Market market = 1;
}

message ListMarketsRequest {}

message ListMarketsResponse {
  repeated Market markets = 1;
}

message GetPositionRequest {
  string account = 1;
}

message GetPositionResponse {
  AccountPosition position = 1;
}

// signed_tx_json carries the caller's fully signed NHB_TX_V3_MAINNET
// transaction, JSON-encoded in the same shape the node's nhb_sendTransaction
// RPC already accepts (chainId/type/nonce/to/value/data/gasLimit/gasPrice/r/s/v).
// The daemon relays it opaquely via nhb_sendTransaction rather than deriving
// or re-signing anything -- account/market/amount below are for
// validation/logging only, never a substitute for the signature: the actual
// on-chain identity comes from the tx's own recovered signer.
message SupplyAssetRequest {
  string account = 1;
  MarketKey market = 2;
  string amount = 3;
  string signed_tx_json = 4;
}

// tx_hash is the mempool-accepted transaction hash (as returned by
// nhb_sendTransaction) -- these mutations are asynchronous, so no
// post-mutation AccountPosition is returned here. Callers poll GetPosition
// once the tx confirms.
message SupplyAssetResponse {
  string tx_hash = 1;
}

message WithdrawAssetRequest {
  string account = 1;
  MarketKey market = 2;
  string amount = 3;
  string signed_tx_json = 4;
}

message WithdrawAssetResponse {
  string tx_hash = 1;
}

message BorrowAssetRequest {
  string account = 1;
  MarketKey market = 2;
  string amount = 3;
  string signed_tx_json = 4;
}

message BorrowAssetResponse {
  string tx_hash = 1;
}

message RepayAssetRequest {
  string account = 1;
  MarketKey market = 2;
  string amount = 3;
  string signed_tx_json = 4;
}

message RepayAssetResponse {
  string tx_hash = 1;
}

message DepositCollateralRequest {
  string account = 1;
  MarketKey market = 2;
  string amount = 3;
  string signed_tx_json = 4;
}

message DepositCollateralResponse {
  string tx_hash = 1;
}

message WithdrawCollateralRequest {
  string account = 1;
  MarketKey market = 2;
  string amount = 3;
  string signed_tx_json = 4;
}

message WithdrawCollateralResponse {
  string tx_hash = 1;
}

// LiquidateRequest is signed by the liquidator, not the borrower --
// liquidation is a permissionless third-party action against someone else's
// unhealthy position (see core/lending_native.go's applyLendingLiquidate).
// borrower identifies the position being liquidated; the liquidator's
// identity comes from signed_tx_json's own recovered signer.
message LiquidateRequest {
  string liquidator = 1;
  MarketKey market = 2;
  string borrower = 3;
  string signed_tx_json = 4;
}

message LiquidateResponse {
  string tx_hash = 1;
}

service LendingService {
  rpc GetMarket(GetMarketRequest) returns (GetMarketResponse);
  rpc ListMarkets(ListMarketsRequest) returns (ListMarketsResponse);
  rpc GetPosition(GetPositionRequest) returns (GetPositionResponse);
  rpc SupplyAsset(SupplyAssetRequest) returns (SupplyAssetResponse);
  rpc WithdrawAsset(WithdrawAssetRequest) returns (WithdrawAssetResponse);
  rpc BorrowAsset(BorrowAssetRequest) returns (BorrowAssetResponse);
  rpc RepayAsset(RepayAssetRequest) returns (RepayAssetResponse);
  rpc DepositCollateral(DepositCollateralRequest) returns (DepositCollateralResponse);
  rpc WithdrawCollateral(WithdrawCollateralRequest) returns (WithdrawCollateralResponse);
  rpc Liquidate(LiquidateRequest) returns (LiquidateResponse);
}
